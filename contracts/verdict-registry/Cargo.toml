[package]
name = "airlock-verdicts"
description = "Airlock verdict registry: which commit of which repository got which verdict, from whom, with which NEAR AI TEE receipt."
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/N-45div/Airlock"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.1"

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
