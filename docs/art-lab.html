<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Held Breath</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Anthropic Brand Colors */
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* Control Sections */
        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        /* Seed Controls */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        /* Parameter Controls */
        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        /* Color Pickers */
        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        /* Responsive - Stack on mobile */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .canvas-area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Control Sidebar -->
        <div class="sidebar">
            <h1>Held Breath</h1>
            <div class="subtitle">Airlock's generative art. Drift crosses a chamber shaped like an Edwards curve; what carries a key is held at the seal. Switch to Sigil to see a verdict's face.</div>

            <!-- Seed Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="12345" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Mode</label>
                    <div class="button-row">
                        <button class="button secondary" id="mode-live" onclick="setMode('live')">Live</button>
                        <button class="button secondary" id="mode-sigil" onclick="setMode('sigil')">Sigil</button>
                    </div>
                </div>

                <div class="control-group live-only">
                    <label>Keyed share (held at the seal)</label>
                    <div class="slider-container">
                        <input type="range" id="keyRate" min="0.02" max="0.3" step="0.01" value="0.1" oninput="updateParam('keyRate', this.value)">
                        <span class="value-display" id="keyRate-value">0.1</span>
                    </div>
                </div>

                <div class="control-group live-only">
                    <label>Density (per 10,000 px²)</label>
                    <div class="slider-container">
                        <input type="range" id="density" min="2" max="14" step="0.5" value="6.5" oninput="updateParam('density', this.value)">
                        <span class="value-display" id="density-value">6.5</span>
                    </div>
                </div>

                <div class="control-group live-only">
                    <label>Speed</label>
                    <div class="slider-container">
                        <input type="range" id="speed" min="0.2" max="2.5" step="0.1" value="1" oninput="updateParam('speed', this.value)">
                        <span class="value-display" id="speed-value">1</span>
                    </div>
                </div>

                <div class="control-group live-only">
                    <label>Chamber size</label>
                    <div class="slider-container">
                        <input type="range" id="chamberR" min="0.18" max="0.46" step="0.01" value="0.34" oninput="updateParam('chamberR', this.value)">
                        <span class="value-display" id="chamberR-value">0.34</span>
                    </div>
                </div>

                <div class="control-group sigil-only">
                    <label>Held lights (wallets caught leaving)</label>
                    <div class="slider-container">
                        <input type="range" id="held" min="0" max="12" step="1" value="3" oninput="updateParam('held', this.value)">
                        <span class="value-display" id="held-value">3</span>
                    </div>
                </div>

                <div class="control-group sigil-only">
                    <label>Verdict</label>
                    <div class="button-row">
                        <button class="button tertiary" onclick="updateParam('verdict', 'safe')">Safe</button>
                        <button class="button" style="background:#b8862f" onclick="updateParam('verdict', 'caution')">Careful</button>
                        <button class="button" style="background:#b3261e" onclick="updateParam('verdict', 'dangerous')">Danger</button>
                    </div>
                </div>
            </div>

            <!-- Colors Section -->
            <div class="control-section live-only">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Drift</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#8a96ff" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#8a96ff</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Cleared</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#63d195" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#63d195</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Held</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#ff9678" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#ff9678</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section (ALWAYS KEEP THIS) -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="initializeSystem()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <div class="button-row" style="margin-top:8px">
                    <button class="button tertiary" onclick="downloadPng()">Download PNG</button>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════════
        // GENERATIVE ART PARAMETERS
        // ═══════════════════════════════════════════════════════════════════════

        let params = {
            seed: 12345,
            mode: 'live',
            keyRate: 0.1,
            density: 6.5,
            speed: 1,
            chamberR: 0.34,
            held: 3,
            verdict: 'dangerous',
            colorPalette: ['#8a96ff', '#63d195', '#ff9678']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ═══════════════════════════════════════════════════════════════════════
        // HOST: p5 makes the canvas; Airlock's engine draws into it
        // ═══════════════════════════════════════════════════════════════════════

        let host = null;
        let stop = () => {};
        const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
        const VERDICT_COLOR = { safe: [29, 115, 72], caution: [184, 134, 47], dangerous: [179, 38, 30] };

        new p5((p) => {
            p.setup = () => {
                host = p.createCanvas(1200, 860);
                host.parent('canvas-container');
                p.noLoop();
                document.querySelector('.loading').style.display = 'none';
                setMode(params.mode);
            };
        });

        function canvasEl() {
            return host.elt;
        }

        function initializeSystem() {
            stop();
            stop = () => {};
            const canvas = canvasEl();
            const seed = String(params.seed);
            if (params.mode === 'live') {
                canvas.style.aspectRatio = '1200 / 860';
                stop = HeldBreathArt.startHeldBreath(canvas, {
                    seed,
                    keyRate: params.keyRate,
                    density: params.density,
                    speed: params.speed,
                    chamber: { x: 0.5, y: 0.5, r: params.chamberR },
                    palette: { bg: [7, 8, 12], drift: hex(params.colorPalette[0]), cleared: hex(params.colorPalette[1]), held: hex(params.colorPalette[2]), seal: [196, 203, 255] }
                });
            } else {
                canvas.style.aspectRatio = '1 / 1';
                const size = 900;
                const dpr = Math.min(2, window.devicePixelRatio || 1);
                canvas.width = size * dpr;
                canvas.height = size * dpr;
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                HeldBreathArt.drawSigil(ctx, size, {
                    seed,
                    held: params.held,
                    colors: { ink: [20, 20, 19], faint: [176, 174, 165], verdict: VERDICT_COLOR[params.verdict], held: [217, 119, 87] }
                });
            }
        }

        function setMode(mode) {
            params.mode = mode;
            document.querySelectorAll('.live-only').forEach((el) => (el.style.display = mode === 'live' ? '' : 'none'));
            document.querySelectorAll('.sigil-only').forEach((el) => (el.style.display = mode === 'sigil' ? '' : 'none'));
            document.getElementById('mode-live').style.opacity = mode === 'live' ? '1' : '0.55';
            document.getElementById('mode-sigil').style.opacity = mode === 'sigil' ? '1' : '0.55';
            initializeSystem();
        }

        function downloadPng() {
            const a = document.createElement('a');
            a.download = `held-breath-${params.mode}-${params.seed}.png`;
            a.href = canvasEl().toDataURL('image/png');
            a.click();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // UI CONTROL HANDLERS
        // ═══════════════════════════════════════════════════════════════════════

        function updateParam(paramName, value) {
            params[paramName] = paramName === 'verdict' ? value : Number(value);
            const display = document.getElementById(`${paramName}-value`);
            if (display) display.textContent = value;
            initializeSystem();
        }

        function updateColor(colorId, value) {
            const i = { color1: 0, color2: 1, color3: 2 }[colorId];
            params.colorPalette[i] = value;
            document.getElementById(`${colorId}-value`).textContent = value;
            initializeSystem();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // SEED CONTROL FUNCTIONS - ALWAYS KEEP THESE
        // ═══════════════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            for (const id of ['keyRate', 'density', 'speed', 'chamberR', 'held']) {
                document.getElementById(id).value = params[id];
                document.getElementById(`${id}-value`).textContent = params[id];
            }
            ['color1', 'color2', 'color3'].forEach((id, i) => {
                document.getElementById(id).value = params.colorPalette[i];
                document.getElementById(`${id}-value`).textContent = params.colorPalette[i];
            });
            updateSeedDisplay();
            setMode(params.mode);
        }

        window.addEventListener('load', function () {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
